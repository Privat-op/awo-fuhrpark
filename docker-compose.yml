services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awo-fuhrpark
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - awo_fuhrpark_data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  awo_fuhrpark_data:
